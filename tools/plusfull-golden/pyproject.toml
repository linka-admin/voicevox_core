[project]
name = "plusfull-golden"
version = "0.0.0"
description = "Golden VOICEVOX kana generated by the pyopenjtalk-plus text frontend"
requires-python = ">=3.11"
dependencies = [
    # The frontend under test, built from source at the v0.4.1-post10 tag
    # commit (see [tool.uv.sources]). Its lib/open_jtalk submodule is
    # tsukumijima/open_jtalk 1e4f83b08992eaa3638416fd1f386f5f37a9d98c.
    "pyopenjtalk-plus[onnxruntime]",
    # Pinned because they change readings produced by run_frontend() defaults:
    # - use_sudachi_kanji_yomi=True (homograph reading fix-up via Sudachi)
    "sudachipy==0.7.0",
    "sudachidict-core==20260723.1",
    # - predict_nani=True (ONNX model for the reading of standalone "何";
    #   without onnxruntime it silently falls back to "ナニ")
    "onnxruntime==1.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pyopenjtalk-plus = { git = "https://github.com/tsukumijima/pyopenjtalk-plus", rev = "b312c6f41dd82a9ac8ea94096fb1d2ff4222c067" }
