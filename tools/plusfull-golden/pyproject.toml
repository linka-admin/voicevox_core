[project]
name = "plusfull-golden"
version = "0.0.0"
description = "Golden VOICEVOX kana generated by the pyopenjtalk-plus text frontend"
requires-python = ">=3.11"
dependencies = [
    # The frontend under test, built from source at a pinned master commit
    # (see [tool.uv.sources]). Its lib/open_jtalk submodule is
    # tsukumijima/open_jtalk f84f40d8eb7510d498f4094ab17b3699c85776bb, the same
    # C sources VOICEVOX CORE builds.
    "pyopenjtalk-plus[onnxruntime]",
    # Pinned because they change readings produced by run_frontend() defaults:
    # - use_sudachi_kanji_yomi=True (homograph reading fix-up via Sudachi)
    "sudachipy==0.7.0",
    "sudachidict-core==20260723.1",
    # - predict_nani=True (ONNX model for the reading of standalone "何";
    #   without onnxruntime it silently falls back to "ナニ")
    "onnxruntime==1.30.0",
]

[tool.uv]
package = false

[tool.uv.sources]
pyopenjtalk-plus = { git = "https://github.com/tsukumijima/pyopenjtalk-plus", rev = "3310e63654473ccee5d38c18a6c93129b641bf85" }
